services:
  sandbox:
    build:
      context: ../..
      dockerfile: apps/sandbox-container/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    tmpfs:
      - /workdir:uid=1000,gid=1000,mode=0700,size=256m
      - /tmp:uid=1000,gid=1000,mode=1777,size=128m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8080/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
